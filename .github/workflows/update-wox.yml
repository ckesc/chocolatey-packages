name: Update Wox Chocolatey package

on:
  schedule:
    # Daily; Wox releases are infrequent. Adjust if you want faster pickup.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      push:
        description: Push nupkg to community.chocolatey.org when a new version is found
        type: boolean
        default: true
      force:
        description: Force AU rebuild/push even if version already matches
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-wox
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Chocolatey-AU
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Chocolatey-AU -Force -Scope CurrentUser -AllowClobber
          Get-Module Chocolatey-AU -ListAvailable | Select-Object Name, Version

      - name: Resolve run options
        id: opts
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          if ($Env:EVENT_NAME -eq 'workflow_dispatch') {
            "push=$Env:INPUT_PUSH" >> $Env:GITHUB_OUTPUT
            "force=$Env:INPUT_FORCE" >> $Env:GITHUB_OUTPUT
          } else {
            'push=true' >> $Env:GITHUB_OUTPUT
            'force=false' >> $Env:GITHUB_OUTPUT
          }

      - name: Run AU updater
        shell: pwsh
        env:
          api_key: ${{ secrets.CHOCOLATEY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          au_Push: ${{ steps.opts.outputs.push }}
          AU_FORCE: ${{ steps.opts.outputs.force }}
        run: |
          $ErrorActionPreference = 'Stop'

          $push = $Env:au_Push -eq 'true'
          $hasKey = -not [string]::IsNullOrWhiteSpace($Env:api_key)
          Write-Host "au_Push=$push api_key_present=$hasKey force=$($Env:AU_FORCE -eq 'true')"

          if ($push -and -not $hasKey) {
            throw "CHOCOLATEY_API_KEY repository secret is missing, but push is enabled.`n`nAdd it under: Settings -> Secrets and variables -> Actions -> New repository secret`nName: CHOCOLATEY_API_KEY`nOr re-run this workflow with push = false for a dry run."
          }

          if ($Env:AU_FORCE -eq 'true') {
            $global:au_Force = $true
          }

          ./update_all.ps1

      - name: Commit package metadata if changed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- wox/src/wox.nuspec wox/src/tools/chocolateyInstall.ps1 wox/src/legal/VERIFICATION.txt wox/src/legal/LICENSE.txt
          if (git diff --cached --quiet) {
            Write-Host 'No package metadata changes to commit.'
            exit 0
          }

          $version = (
            Select-Xml -Path wox/src/wox.nuspec -XPath '//*[local-name()="version"]' |
            Select-Object -ExpandProperty Node |
            Select-Object -ExpandProperty '#text'
          )
          git commit -m "Update Wox package to $version"
          git push
